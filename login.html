<!DOCTYPE html>
<html lang="en">

<head>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="login-box">

        <h2>⚡ Transformer AI Login</h2>

            id="password"

        <br><br>

        <button onclick="login()">

            Login

        </button>

        <br><br>

        <p>

            Username :
            <b>admin</b>

            Password :

        </p>

    </div>

    <script src="script.js"></script>

</body>

</html>
